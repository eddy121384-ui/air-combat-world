name: Xinyi Lookdev Inputs

# Snapshot the *locked* projected WFS source plus look-dev context (basin DTM
# backdrop, OSM ground context) into data/lookdev_cache/ on the visual-quality
# branch, so look-dev machines without WFS/HF/Overpass egress can regenerate the
# accepted 25 tiles byte-for-byte with the existing pipeline.
#
# Fails closed unless the fetched WFS source equals the accepted SHA-256.

on:
  push:
    branches:
      - feat/opus55-xinyi-visual-quality
    paths:
      - "tools/lookdev/fetch_lookdev_inputs.py"
      - ".github/workflows/xinyi-lookdev-inputs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xinyi-lookdev-inputs
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-terrain-v0.txt

      - name: Install validated stack
        run: python -m pip install -r requirements-terrain-v0.txt

      - name: Fetch locked projected Xinyi WFS source
        run: node tools/citygen_v2/fetch_projected_sample.mjs

      - name: Require accepted source SHA-256
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("data/generated/taipei/sample_buildings_epsg3826.geojson")
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          want = "c7ca8da13a4c5baaab0fbd1fcfe5b3799723d49d1998f804cf1593904f70200d"
          assert got == want, f"projected WFS source drifted: {got} != {want}"
          print("SOURCE_SHA_OK", got)
          PY

      - name: Fetch accepted Xinyi MOI 2025 DTM mirror
        run: python tools/terrain/fetch_moi_2025_dtm_mirror.py

      - name: Fetch basin backdrop DTM + OSM ground context
        run: python tools/lookdev/fetch_lookdev_inputs.py

      - name: Stage cache
        run: |
          mkdir -p data/lookdev_cache
          gzip -n -9 -c data/generated/taipei/sample_buildings_epsg3826.geojson > data/lookdev_cache/sample_buildings_epsg3826.geojson.gz
          cp data/generated/taipei/sample_buildings_epsg3826.manifest.json data/lookdev_cache/
          cp data/generated/taipei/terrain/cache/moi_2025_dtm_xinyi_mirror.tif data/lookdev_cache/
          cp data/generated/taipei/terrain/moi_2025_dtm_mirror_source.json data/lookdev_cache/
          ls -la data/lookdev_cache

      - name: Commit cache to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/lookdev_cache
          if git diff --cached --quiet; then
            echo "cache unchanged"
            exit 0
          fi
          git commit -m "data: snapshot locked Xinyi lookdev inputs"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
