name: Xinyi Robust Whitebox v2

on:
  push:
    branches:
      - feat/xinyi-robust-whitebox-v2
  pull_request:
    paths:
      - "tools/citygen_v2/**"
      - "tools/compiler/worldmodel.py"
      - "tests/test_citygen_v2.py"
      - "requirements-citygen-v2.txt"
      - ".github/workflows/xinyi-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representative-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-citygen-v2.txt

      - name: Install mature geometry stack
        run: python -m pip install -r requirements-citygen-v2.txt

      - name: Audit pinned Xinyi source
        run: python tools/citygen_v2/audit_source.py

      - name: Probe WFS precision in projected CRS
        run: node tools/citygen_v2/probe_wfs_precision.mjs

      - name: Fetch projected v2 source
        run: node tools/citygen_v2/fetch_projected_sample.mjs

      - name: Regenerate v0 artifacts for backward-compatibility tests
        run: |
          python tools/compiler/worldmodel.py
          python tools/compiler/build_tile.py

      - name: Run compiler and v2 tests
        run: python -m unittest discover -s tests -v

      - name: Strict serialization-space gate for locked 80 parts
        run: python tools/citygen_v2/build_representative.py --count 80

      - name: Upload numerical and Blender-ready evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-v2-representative-evidence
          if-no-files-found: ignore
          path: |
            data/generated/taipei/xinyi_v2_source_audit.report.json
            data/generated/taipei/xinyi_v2_wfs_precision_probe.report.json
            data/generated/taipei/sample_buildings_epsg3826.manifest.json
            data/generated/taipei/xinyi_v2_representative.report.json
            data/generated/taipei/xinyi_v2_representative_80.glb
            data/generated/taipei/xinyi_v2_serialization.report.json
            data/generated/taipei/xinyi_v2_serialization_80.glb

  full-xinyi-gate:
    needs: representative-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-citygen-v2.txt

      - name: Install mature geometry stack
        run: python -m pip install -r requirements-citygen-v2.txt

      - name: Fetch projected v2 source
        run: node tools/citygen_v2/fetch_projected_sample.mjs

      - name: Build and strictly validate full Xinyi run 1
        run: python tools/citygen_v2/build_full_xinyi.py --out unreal/Saved/XinyiV2Full/run-01

      - name: Diagnose full Xinyi failures
        if: always()
        run: |
          if [ -f unreal/Saved/XinyiV2Full/run-01/full_xinyi.report.json ]; then
            python tools/citygen_v2/diagnose_full_xinyi_failures.py --report unreal/Saved/XinyiV2Full/run-01/full_xinyi.report.json --out unreal/Saved/XinyiV2Full/run-01/full_xinyi.diagnosis.json
          fi

      - name: Build and strictly validate full Xinyi run 2
        run: python tools/citygen_v2/build_full_xinyi.py --out unreal/Saved/XinyiV2Full/run-02

      - name: Verify deterministic tile hashes
        run: python tools/citygen_v2/compare_full_xinyi_runs.py unreal/Saved/XinyiV2Full/run-01/full_xinyi.report.json unreal/Saved/XinyiV2Full/run-02/full_xinyi.report.json

      - name: Upload full Xinyi evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-v2-full-evidence
          if-no-files-found: ignore
          compression-level: 6
          path: |
            unreal/Saved/XinyiV2Full/run-01/full_xinyi.report.json
            unreal/Saved/XinyiV2Full/run-01/full_xinyi.ledger.jsonl.gz
            unreal/Saved/XinyiV2Full/run-01/full_xinyi.diagnosis.json
            unreal/Saved/XinyiV2Full/run-01/tiles/*.glb
            unreal/Saved/XinyiV2Full/run-02/full_xinyi.report.json

  blender-full-xinyi-gate:
    needs: full-xinyi-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download full Xinyi geometry evidence
        uses: actions/download-artifact@v4
        with:
          name: xinyi-v2-full-evidence
          path: unreal/Saved/XinyiV2Full

      - name: Download pinned official Blender 5.2.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz \
            --output blender-5.2.0-linux-x64.tar.xz
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.0.sha256 \
            --output blender-5.2.0.sha256
          grep 'blender-5.2.0-linux-x64.tar.xz' blender-5.2.0.sha256 | sha256sum --check -
          tar -xf blender-5.2.0-linux-x64.tar.xz

      - name: Install headless Mesa / EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri

      - name: Blender headless audit of all 25 tiles
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          mkdir -p unreal/Saved/XinyiV2Blender/screenshots
          ./blender-5.2.0-linux-x64/blender \
            --background \
            --factory-startup \
            --python-exit-code 2 \
            --python tools/citygen_v2/blender_full_xinyi_audit.py \
            -- \
            --tiles unreal/Saved/XinyiV2Full/run-01/tiles \
            --numerical unreal/Saved/XinyiV2Full/run-01/full_xinyi.report.json \
            --out unreal/Saved/XinyiV2Blender/full_xinyi.blender.report.json \
            --screenshots unreal/Saved/XinyiV2Blender/screenshots

      - name: Upload Blender full-Xinyi evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-v2-blender-evidence
          if-no-files-found: error
          compression-level: 6
          path: |
            unreal/Saved/XinyiV2Blender/full_xinyi.blender.report.json
            unreal/Saved/XinyiV2Blender/screenshots/*.png

