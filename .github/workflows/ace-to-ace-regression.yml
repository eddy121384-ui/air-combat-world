name: Ace to Ace regressions

on:
  push:
    branches: [claude/vibrant-dirac-kmsuin]
    paths:
      - "prototypes/ace-to-ace/**"
      - ".github/workflows/ace-to-ace-regression.yml"
  pull_request:
    paths:
      - "prototypes/ace-to-ace/**"
      - ".github/workflows/ace-to-ace-regression.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser module syntax
        working-directory: prototypes/ace-to-ace
        run: |
          node --check src/game/main.js
          node --check src/game/input.js
          node --check src/sim/aircraft.js
          node --check src/game/render.js
          node --check src/game/hud.js
          node --check src/sim/warnings.js
      - name: Node flight and AI regression tests
        working-directory: prototypes/ace-to-ace
        run: |
          node tools/test-airbrake-throttle.mjs
          node tools/test-power-strip.mjs
          node tools/test-brake-trap.mjs
          node tools/test-flight-path.mjs
          node tools/test-hud-attitude.mjs
          node tools/test-flight-feel-ab.mjs
          node tools/test-dual-flight-modes.mjs
          node tools/test-flight-feel-polish.mjs
          node tools/aivai.mjs --n 3 --blue chaser --red veteran --feel arcade
          node tools/aivai.mjs --n 3 --blue chaser --red veteran --feel tactical
          node tools/aivai.mjs --n 3 --blue chaser --red veteran --feel B
          node tools/aivai.mjs --n 3 --blue human --red veteran --feel arcade --control expert
          node tools/aivai.mjs --n 3 --blue human --red veteran --feel tactical --control assisted
          node tools/probe-flight-feel.mjs > /dev/null

  browser:
    # Real Chromium (SwiftShader WebGL): settings menu x4 modes, pause/resume,
    # keyboard and iPhone-sized touch input. Not a substitute for iPhone Safari.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        working-directory: prototypes/ace-to-ace
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser checks
        working-directory: prototypes/ace-to-ace
        run: |
          node tools/browser-check.mjs --scenario settings
          node tools/browser-check.mjs --scenario manual
          node tools/browser-check.mjs --scenario touch
          node tools/browser-check.mjs --scenario modes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ace-to-ace-browser-shots
          path: prototypes/ace-to-ace/tools/out/shots
          if-no-files-found: ignore
