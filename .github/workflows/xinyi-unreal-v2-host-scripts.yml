name: Xinyi Unreal V2 Host Scripts

on:
  push:
    branches:
      - feat/xinyi-unreal-v2
    paths:
      - "adapters/unreal/*xinyi_v2*.py"
      - "adapters/unreal/import_xinyi_v2_buildings.py"
      - "adapters/unreal/verify_xinyi_v2_building_import.py"
      - "tools/unreal_xinyi_v2/*.ps1"
      - "unreal/Plugins/XinyiLandscapeBridge/**"
      - "unreal/AirCombatWorld.uproject"
      - ".github/workflows/xinyi-unreal-v2-host-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-host-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile XinyiV2 Unreal Python adapters
        run: |
          python -m py_compile             adapters/unreal/xinyi_v2_api_probe.py             adapters/unreal/import_xinyi_v2_buildings.py             adapters/unreal/verify_xinyi_v2_building_import.py             adapters/unreal/probe_xinyi_v2_building_bounds.py             adapters/unreal/plan_xinyi_v2_building_placement.py             adapters/unreal/build_xinyi_v2_landscape.py             adapters/unreal/verify_xinyi_v2_landscape_reopen.py             adapters/unreal/import_xinyi_v2_runtime_tiles.py             adapters/unreal/verify_xinyi_v2_runtime_tiles_existing.py             adapters/unreal/place_xinyi_v2_runtime_tiles.py             adapters/unreal/verify_xinyi_v2_runtime_world_reopen.py             adapters/unreal/prepare_xinyi_v2_whitebox_materials.py             adapters/unreal/capture_xinyi_v2_views.py             adapters/unreal/audit_xinyi_v2_world_partition.py

      - name: Parse PowerShell gate scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @(
            "tools/unreal_xinyi_v2/build_landscape_bridge.ps1",
            "tools/unreal_xinyi_v2/run_local_gate.ps1",
            "tools/unreal_xinyi_v2/fetch_and_run_local_gate.ps1",
            "tools/unreal_xinyi_v2/resume_runtime_world.ps1",
            "tools/unreal_xinyi_v2/capture_views.ps1",
            "tools/unreal_xinyi_v2/audit_world_partition.ps1",
            "tools/unreal_xinyi_v2/create_isolated_wp_test.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              throw "PowerShell parse failed: $path"
            }
            Write-Host "POWERSHELL_PARSE_OK $path"
          }

      - name: Validate resume input restoration path
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("tools/unreal_xinyi_v2/resume_runtime_world.ps1").read_text()
          for token in (
              "Download-InputRun",
              "gh run download",
              "RunId",
              "XINYI_V2_RESUME_INPUT_OK",
              "runtime_glbs",
          ):
              assert token in text, token
          print("RESUME_INPUT_RESTORE_GUARD_OK")
          PY

      - name: Guard readable whitebox lighting contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("adapters/unreal/capture_xinyi_v2_views.py").read_text()
          required = (
              "ComponentMobility.MOVABLE",
              "AEM_MANUAL",
              "ExponentialHeightFog",
              "SceneCapture2D",
              "SceneCaptureComponent2D",
              "create_render_target2d",
              "SCS_FINAL_COLOR_LDR",
              "capture_scene",
              "export_render_target",
              "editor_viewport_dependency",
              "world_saved_after_overrides",
          )
          for token in required:
              assert token in text, token
          forbidden = (
              "take_high_res_screenshot",
              "set_editor_viewport_view_mode",
              "ViewModeIndex.VMI_LIT",
          )
          for token in forbidden:
              assert token not in text, token
          print("READABLE_WHITEBOX_LIGHTING_GUARD_OK")
          PY

      - name: Guard read-only World Partition audit
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("adapters/unreal/audit_xinyi_v2_world_partition.py").read_text()
          required = (
              "world_partition",
              "enable_streaming",
              "is_spatially_loaded",
              "runtime_grid",
              "data_layer_assets",
              "hlod_layer",
              "external_data_layer_asset",
              "get_actor_descs_for_actors",
              "get_outermost",
              '"audit_is_read_only": True',
              '"world_saved_after_audit": False',
          )
          for token in required:
              assert token in text, token
          forbidden = (
              "save_current_level",
              "save_asset",
              "spawn_actor",
              "destroy_actor",
              ".set_editor_property(",
              ".new_level(",
              "WorldPartitionConvert",
          )
          for token in forbidden:
              assert token not in text, token
          print("WORLD_PARTITION_AUDIT_READ_ONLY_GUARD_OK")
          PY

      - name: Guard isolated World Partition migration
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("tools/unreal_xinyi_v2/create_isolated_wp_test.ps1").read_text()
          required = (
              "WorldPartitionConvertCommandlet",
              "-ReportOnly",
              "-ConversionSuffix",
              "Start-Process",
              "-Wait",
              "-PassThru",
              "reportExitCode",
              "convertExitCode",
              "-SCCProvider=None",
              "L_XinyiV2_Contract_WP",
              "XINYI_V2_ISOLATED_WP_MIGRATION_OK",
              "descriptor_runtime_building_tiles",
          )
          for token in required:
              assert token in text, token
          forbidden = (
              "Remove-Item -Recurse",
              "DeleteSourceLevels",
              "AllowCommandletRendering",
          )
          for token in forbidden:
              assert token not in text, token
          print("ISOLATED_WORLD_PARTITION_MIGRATION_GUARD_OK")
          PY

      - name: Validate project and plugin descriptors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          project = json.loads(Path("unreal/AirCombatWorld.uproject").read_text())
          plugin = json.loads(Path(
              "unreal/Plugins/XinyiLandscapeBridge/XinyiLandscapeBridge.uplugin"
          ).read_text())

          enabled = {
              p["Name"]: bool(p.get("Enabled"))
              for p in project.get("Plugins", [])
          }
          assert enabled.get("XinyiLandscapeBridge") is True
          modules = plugin.get("Modules", [])
          assert len(modules) == 1
          assert modules[0]["Name"] == "XinyiLandscapeBridge"
          assert modules[0]["Type"] == "Editor"
          assert plugin.get("CanContainContent") is False
          print("PLUGIN_DESCRIPTOR_OK")
          PY

      - name: Static guardrails for the minimal Landscape bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          cpp = Path(
              "unreal/Plugins/XinyiLandscapeBridge/Source/"
              "XinyiLandscapeBridge/Private/XinyiLandscapeLibrary.cpp"
          ).read_text()

          required = [
              "ALandscape",
              "Landscape->Import(",
              "ELandscapeImportAlphamapType::Layered",
              "ComponentSizeQuads = ComponentSizeQuads",
              "SubsectionSizeQuads = SubsectionSizeQuads",
              "NumSubsections = NumSubsections",
              "LandscapeComponents.Num()",
              "GetLandscapeExtent(",
              "LoadFileToArray",
          ]
          for token in required:
              assert token in cpp, f"missing bridge guardrail token: {token}"

          forbidden = [
              "http://",
              "https://",
              "rasterio",
              "GDAL",
              "ground_elev_m",
              "make_valid",
              "bCanHaveLayersContent",
              "CreateLandscapeInfo(",
          ]
          for token in forbidden:
              assert token not in cpp, f"bridge must not own source/elevation logic: {token}"

          print("LANDSCAPE_BRIDGE_STATIC_GUARDRAILS_OK")
          PY
