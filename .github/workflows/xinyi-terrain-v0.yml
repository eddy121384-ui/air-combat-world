name: Xinyi Terrain v0

on:
  push:
    branches:
      - feat/xinyi-terrain-v0
    paths:
      - "tools/terrain/**"
      - ".github/workflows/xinyi-terrain-v0.yml"
      - "cities/taipei/**"
      - "tools/citygen_v2/fetch_projected_sample.mjs"
      - "tools/compiler/worldmodel.py"
      - "requirements-citygen-v2.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked projected Xinyi building source
        run: node tools/citygen_v2/fetch_projected_sample.mjs

      - name: Audit official MOI 2025 20 m DTM catalog
        run: node tools/terrain/audit_nlsc_dtm_source.mjs

      - name: Audit surveyed WFS building ground elevations
        run: python tools/terrain/audit_building_ground_elevation.py

      - name: Download official Taipei 20 m DTM package
        id: official_dtm_download
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p data/generated/taipei/terrain/cache
          TARGET=data/generated/taipei/terrain/cache/taipei_20m_dtm_2025.zip
          if wget --tries=1 --timeout=45 --referer=https://www.tgos.tw/ \
              -O "$TARGET" \
              'https://www.tgos.tw:443/MDE/VirtualDir_TC/Product/60e634ea-7c59-47a4-a967-ac33694e0d05/分幅_臺北市20MDEM(2025).zip'; then
            echo 'moi_2025_tgos' > data/generated/taipei/terrain/cache/source_provider.txt
          else
            rm -f "$TARGET"
            wget --tries=2 --timeout=90 \
              -O "$TARGET" \
              'https://data.moi.gov.tw/MoiOD/System/DownloadFile.aspx?DATA=988131C6-80C5-46D4-8E2E-96BC3029A830'
            echo 'moi_legacy_20m_taipei' > data/generated/taipei/terrain/cache/source_provider.txt
          fi

      - name: Inspect official Taipei DTM package
        if: steps.official_dtm_download.outcome == 'success'
        run: python tools/terrain/fetch_taipei_dtm_2025.py

      - name: Record cloud-download blocker
        if: steps.official_dtm_download.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/generated/taipei/terrain/official_dtm_cloud_download_blocker.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
            "status":"BLOCKED_ON_GITHUB_HOSTED_RUNNER",
            "production_target":"official MOI/TGOS 20m DTM",
            "tgos_2025_result":"HTTP 403 from GitHub-hosted runner",
            "legacy_moi_result":"connection timeout from GitHub-hosted runner",
            "meaning":"network delivery restriction; not a rejection of the official dataset",
            "next":"continue pipeline prototyping with a separately labeled cloud-readable terrain source; replace source without changing tile/coordinate contract"
          },indent=2)+"\n")
          PY

      - name: Upload terrain source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-terrain-v0-source-audit
          if-no-files-found: error
          path: |
            data/generated/taipei/terrain/nlsc_dtm_2025_source_audit.json
            data/generated/taipei/terrain/nlsc_dtm_2025_catalog.csv
            data/generated/taipei/terrain/taipei_dtm_2025_package_audit.json
            data/generated/taipei/terrain/building_ground_elevation_audit.json
            data/generated/taipei/terrain/official_dtm_cloud_download_blocker.json
