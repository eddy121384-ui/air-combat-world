name: Xinyi Terrain v0

on:
  push:
    branches:
      - feat/xinyi-terrain-v0
    paths:
      - "tools/terrain/**"
      - ".github/workflows/xinyi-terrain-v0.yml"
      - "cities/taipei/**"
      - "tools/citygen_v2/fetch_projected_sample.mjs"
      - "tools/compiler/worldmodel.py"
      - "requirements-citygen-v2.txt"
      - "requirements-terrain-v0.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked projected Xinyi building source
        run: node tools/citygen_v2/fetch_projected_sample.mjs

      - name: Audit official MOI 2025 20 m DTM catalog
        run: node tools/terrain/audit_nlsc_dtm_source.mjs

      - name: Audit surveyed WFS building ground elevations
        run: python tools/terrain/audit_building_ground_elevation.py

      - name: Record official DTM cloud-download blocker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/generated/taipei/terrain/official_dtm_cloud_download_blocker.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
            "status":"BLOCKED_ON_GITHUB_HOSTED_RUNNER",
            "production_target":"official MOI/TGOS 2025 Taipei 20m DTM",
            "tgos_2025_result":"HTTP 403 from GitHub-hosted runner",
            "legacy_moi_result":"TCP/HTTPS connection timeout from GitHub-hosted runner",
            "meaning":"network delivery restriction; official dataset remains production target",
            "prototype_policy":"use separately labeled Copernicus GLO-30 DSM only to exercise cloud pipeline"
          },indent=2)+"\n")
          PY

      - name: Set up Python for terrain prototype
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-terrain-v0.txt

      - name: Install terrain prototype stack
        run: python -m pip install -r requirements-terrain-v0.txt

      - name: Fetch cloud-readable Copernicus GLO-30 prototype source
        run: python tools/terrain/fetch_copernicus_prototype.py

      - name: Build deterministic Xinyi terrain prototype tiles
        run: python tools/terrain/build_xinyi_terrain_prototype.py

      - name: Upload terrain source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-terrain-v0-evidence
          if-no-files-found: error
          path: |
            data/generated/taipei/terrain/nlsc_dtm_2025_source_audit.json
            data/generated/taipei/terrain/nlsc_dtm_2025_catalog.csv
            data/generated/taipei/terrain/taipei_dtm_2025_package_audit.json
            data/generated/taipei/terrain/building_ground_elevation_audit.json
            data/generated/taipei/terrain/official_dtm_cloud_download_blocker.json
            data/generated/taipei/terrain/copernicus_glo30_prototype_source.json
            unreal/Saved/XinyiTerrainV0/terrain_prototype.report.json
            unreal/Saved/XinyiTerrainV0/building_z_offsets.json
            unreal/Saved/XinyiTerrainV0/tiles/*.glb

  terrain-preview:
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Download current terrain evidence
        uses: actions/download-artifact@v4
        with:
          name: xinyi-terrain-v0-evidence
          path: .

      - name: Download validated Full-Xinyi building tiles
        uses: actions/download-artifact@v4
        with:
          name: xinyi-v2-full-evidence
          path: unreal/Saved/XinyiV2Full
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35557915078

      - name: Download pinned official Blender 5.2.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz \
            --output blender-5.2.0-linux-x64.tar.xz
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.0.sha256 \
            --output blender-5.2.0.sha256
          grep 'blender-5.2.0-linux-x64.tar.xz' blender-5.2.0.sha256 | sha256sum --check -
          tar -xf blender-5.2.0-linux-x64.tar.xz

      - name: Install headless Mesa / EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri

      - name: Render terrain plus surveyed-Z buildings
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          mkdir -p unreal/Saved/XinyiTerrainV0/preview
          ./blender-5.2.0-linux-x64/blender \
            --background \
            --factory-startup \
            --python-exit-code 2 \
            --python tools/terrain/blender_terrain_preview.py \
            -- \
            --buildings unreal/Saved/XinyiV2Full/run-01/tiles \
            --terrain unreal/Saved/XinyiTerrainV0/tiles \
            --building-z unreal/Saved/XinyiTerrainV0/building_z_offsets.json \
            --out unreal/Saved/XinyiTerrainV0/preview

      - name: Upload terrain preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-terrain-v0-preview
          if-no-files-found: error
          path: |
            unreal/Saved/XinyiTerrainV0/preview/*.png
            unreal/Saved/XinyiTerrainV0/preview/preview.json
