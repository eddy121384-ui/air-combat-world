name: Xinyi Terrain v0

on:
  push:
    branches:
      - feat/xinyi-terrain-v0
    paths:
      - "tools/terrain/**"
      - ".github/workflows/xinyi-terrain-v0.yml"
      - "cities/taipei/**"
      - "tools/citygen_v2/fetch_projected_sample.mjs"
      - "tools/compiler/worldmodel.py"
      - "requirements-citygen-v2.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch locked projected Xinyi building source
        run: node tools/citygen_v2/fetch_projected_sample.mjs

      - name: Audit official MOI 2025 20 m DTM catalog
        run: node tools/terrain/audit_nlsc_dtm_source.mjs

      - name: Download official Taipei City 2025 DTM package
        run: |
          mkdir -p data/generated/taipei/terrain/cache
          wget --tries=3 --timeout=90 --referer=https://www.tgos.tw/ \
            -O data/generated/taipei/terrain/cache/taipei_20m_dtm_2025.zip \
            'https://www.tgos.tw:443/MDE/VirtualDir_TC/Product/60e634ea-7c59-47a4-a967-ac33694e0d05/分幅_臺北市20MDEM(2025).zip'
          wget --tries=3 --timeout=90 --referer=https://www.tgos.tw/ \
            -O data/generated/taipei/terrain/cache/schema_hdr.zip \
            'https://www.tgos.tw:443/MDE/VirtualDir_TC/Product/342505d1-81bc-490a-8e10-9f7e1ec0ed98/schema_hdr.zip'

      - name: Inspect Taipei City 2025 DTM package
        run: python tools/terrain/fetch_taipei_dtm_2025.py

      - name: Upload terrain source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xinyi-terrain-v0-source-audit
          if-no-files-found: error
          path: |
            data/generated/taipei/terrain/nlsc_dtm_2025_source_audit.json
            data/generated/taipei/terrain/nlsc_dtm_2025_catalog.csv
            data/generated/taipei/terrain/taipei_dtm_2025_package_audit.json
