; Unreal MCP (Model Context Protocol) server settings.
; Verified 2026-09-12 via DLL string mining + live probe:
; class UModelContextProtocolSettings (module ModelContextProtocolEngine),
; Project Settings -> Plugins -> Model Context Protocol.
; bAutoStartServer=True persists the Editor-Preferences "Auto Start Server" tick.
; ServerPortNumber default is 8000 (endpoint http://127.0.0.1:8000/mcp).
; CLI alternatives: -ModelContextProtocolStartServer (force start),
; -ModelContextProtocolPort=N (override port).

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8000
