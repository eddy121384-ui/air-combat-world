; North Taiwan forest - MOBILE FOREST PROFILE: the startup cvars of the phone tiers (docs/north-taiwan-forest-mobile-profile-v1.md).
; The material side of the profile is chosen by the renderer (SHADING_PATH_MOBILE in the forest materials, MPC_NF_Forest *M twins);
; these cvars are the engine side. The SAME list is applied to the PC ES3.1 preview runs (tools/ntw/forest_world/mobile_cvars.ps1 reads
; the [Android DeviceProfile] block below and passes it as -dpcvars), so preview and device builds cannot drift apart.
;   r.DetailMode=0 + r.CookOutUnusedDetailModeComponents=1   tree rank bands 0.55-1 (Medium / High detail mode, nf_mobile_profile.py) are
;                                                             not rendered, and are stripped from the cooked phone build
;   foliage.MaxEndCullDistance=165000                        no tree HISM is submitted past 1.65 km (mobile thinning ends at 1.5 km)
;   (foliage.MinLOD=1 was tried and rejected: the cryptomeria LOD1 has 1.4 k of its 15 k triangles and the plantation showed bare trunks)
;   r.Shadow.DistanceScale=0.2 (3 km x 0.2 = 600 m), 2 CSM cascades at 1024: tree shadows only where they read; the canopy texture
;                                                             carries the baked crown shading beyond

; Terrain fix (all platforms): the Landscape heightmaps never stream. The 26.5 km Landscape is always resident (not spatially loaded,
; ~20 MB of heightmap incl. mips), but in COOKED builds its heightmap mips streamed in after a camera cut; until they arrived, coarse
; point-sampled mips turned slopes into plateaus and vertical steps (PR #52 packaged_t020s.jpg; reproduced in the PR #52 package,
; gone with r.Streaming.FullyLoadUsedTextures 1, never in the editor). Same entry as BaseDeviceProfiles.ini plus NumStreamedMips=0.
[GlobalDefaults DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_Terrain_Heightmap,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage,NumStreamedMips=0)

; PC keeps every tree at every scalability level, exactly as PR #46-#52: r.DetailMode is ALSO set by sg.EffectsQuality (BaseScalability:
; Low 0, Medium / High 1, Epic 3), which would silently drop the Medium / High tree rank bands on a PC at Effects Medium / High.
; A device-profile cvar outranks scalability, so the forest density on Windows does not follow the effects setting.
[Windows DeviceProfile]
+CVars=r.DetailMode=3

; Graphics Settings v1 (docs/skyfront-graphics-settings-v1.md) replaces the single fixed phone tier with player presets. These profile values are
; only the start-up state before the saved settings are applied (USkyfrontGameUserSettings, SetByCode outranks the device profile):
;   - r.CookOutUnusedDetailModeComponents=1 REMOVED: it stripped the Medium / High tree rank bands (45 % of the trees) from the phone cook, so
;     no runtime setting could bring them back. All bands are cooked; r.DetailMode 0 / 1 / 2 picks 55 / 78 / 100 % at runtime.
;   - foliage.MaxEndCullDistance=165000 REMOVED: the engine applies it to EVERY HISM (HierarchicalInstancedStaticMesh.cpp), so it also cut the
;     9 km town HISMs to 1.65 km - the "buildings vanish at 1-2 km" seen on the Tab S11. Tree culls now follow the tree-distance setting.
;   - r.MobileContentScaleFactor 0 = native back buffer (the engine's Android tiers set 1.0 = 1280x720-based, ~1280x800 on the 2560x1600 S11);
;     the 3D resolution is the player's r.ScreenPercentage. Removed from the engine tiers below too, a child tier's value would win.
;   - r.Shadow.CSM.MaxMobileCascades does not exist in UE 5.8 (the PR #55 line was a no-op); the cascade count is r.Shadow.CSM.MaxCascades.
[Android DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileContentScaleFactor=0
+CVars=r.DetailMode=1
+CVars=r.Shadow.DistanceScale=0.2
+CVars=r.Shadow.CSM.MaxCascades=2
+CVars=r.Shadow.MaxCSMResolution=1024

[IOS DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0
+CVars=r.MobileContentScaleFactor=0
+CVars=r.DetailMode=1
+CVars=r.Shadow.DistanceScale=0.2
+CVars=r.Shadow.CSM.MaxCascades=2
+CVars=r.Shadow.MaxCSMResolution=1024

[Android_Low DeviceProfile]
-CVars=r.MobileContentScaleFactor=0.8

[Android_Mid DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0

[Android_High DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0

[Android_Epic DeviceProfile]
-CVars=r.MobileContentScaleFactor=1.0
