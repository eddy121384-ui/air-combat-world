; TreeLookdev (tree look-dev phase 2). Isolated test project: one game-version tree vs its Blender golden reference.
; Render state is pinned here (same family as ForestSpike: no GI / Lumen / Nanite / VSM on this SM5 iGPU host),
; but screen-space AO stays ON: foliage without any ambient occlusion is not a fair comparison with path-traced Cycles.

[/Script/Engine.RendererSettings]
; Graphics Settings v1: mobile SSAO shader permutation (project-wide, cooked); the pass itself is switched per preset with r.AmbientOcclusionLevels.
; The mobile renderer had no ambient occlusion at all - one cause of the flat / "plastic" forest and terrain on the Tab S11.
r.Mobile.AmbientOcclusion=True
; Graphics Settings v1: FULL precision for material expressions on mobile. With the default (half), every M_NF_* material evaluated its distance
; math in fp16 on the phone GPU (MaterialFloat = half in pixel shaders, Common.ush): the forest thinning (NearFull / ThinEnd up to 3.4 km = 340000 cm),
; the Landscape distance bands (3.5 - 11 km) and the canopy shell overflow fp16 (max 65504) beyond ~655 m -> trees dissolved early and the far bands
; collapsed to one flat colour on the Tab S11. The PC ES3.1 preview evaluates half as float, so it never showed this. Lighting stays half.
r.Mobile.FloatPrecisionMode=1
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Lumen.DiffuseIndirect.Allow=0
r.GenerateMeshDistanceFields=False
r.Nanite.ProjectEnabled=False
r.Shadow.Virtual.Enable=0
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.AntiAliasingMethod=2
r.CustomDepth=3
r.PostProcessing.PropagateAlpha=0
r.EarlyZPass=3
r.EarlyZPassOnlyMaterialMasking=False
; Forest runtime gate: tree WPO velocity is disabled PER COMPONENT (world_position_offset_writes_velocity=False on the 17,351 tree HISMs,
; adapters/unreal/ntwforest/nf_gate_prep.py) instead of the PR #50 project-wide r.Velocity.EnableVertexDeformation=0, so future animated
; WPO materials keep correct motion vectors.

