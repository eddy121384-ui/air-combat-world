; Forest perf: World Partition streaming budget for low frame rates. At ~8-13 fps on the UHD 770 the default few-ms-per-frame budgets
; cannot register the forest tiles entering the 3.4 km loading range at 240 m/s (Slow -> Critical -> blocking "Immediate" loads).
; Measured (rt_t28 vs rt_t28_stream): with these values the flight keeps streaming "Good" except one 1.5 s "Slow".
s.AsyncLoadingTimeLimit=15
s.LevelStreamingActorsUpdateTimeLimit=15
s.LevelStreamingComponentsRegistrationGranularity=40
s.LevelStreamingAddPrimitiveGranularity=40
wp.Runtime.MaxLoadingStreamingCells=8

