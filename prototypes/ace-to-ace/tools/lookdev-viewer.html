<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ace to Ace — NPR art check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;overflow:hidden;background:#718da1}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
</head><body><canvas id="gl"></canvas><script type="module">
// Fixed art-review cameras using the game's real Renderer; no extra gameplay UI.
import * as THREE from 'three';
import { Renderer } from '../src/game/render.js';
import { Match } from '../src/sim/world.js';
const loaded = new Promise(resolve => { THREE.DefaultLoadingManager.onLoad = resolve; });
const r = new Renderer(document.querySelector('canvas'));
const m = new Match({ seed: 7, blue: { type: 'F16V' }, red: { type: 'J16' } });
const ac = m.blue;
ac.pos = { x: 0, y: 2800, z: 0 };
ac.q = { x: 0, y: 0, z: 0, w: 1 };
m.red.pos = { x: 110, y: 2830, z: -150 };
r.addAircraft(ac); r.addAircraft(m.red);
r.update(m, { ac }, 0);
const view = new URLSearchParams(location.search).get('view') || 'chase';
r.camera.fov = 45;
if (view === 'bank') {
  r.camera.position.set(25, 2815, 38); r.camera.up.set(-0.6, 0.8, 0);
} else if (view === 'cloud') {
  const matrix = new THREE.Matrix4(); r.clouds.getMatrixAt(0, matrix);
  const center = new THREE.Vector3().setFromMatrixPosition(matrix);
  r.camera.position.copy(center).add(new THREE.Vector3(0, 0, 300));
} else if (view === 'ocean') {
  r.camera.position.set(0, 300, 50);
} else if (view === 'dive') {
  r.camera.position.set(0, 4100, 1); r.camera.up.set(0, 0, -1);
} else {
  r.camera.position.set(27, 2813, 40);
}
if (view === 'cloud') r.camera.lookAt(r.camera.position.clone().add(new THREE.Vector3(0, 0, -1000)));
else if (view === 'ocean') r.camera.lookAt(-1800, 0, -3500);
else r.camera.lookAt(0, 2800, -16);
r.camera.updateProjectionMatrix();
r.sky.position.copy(r.camera.position);
r.sea.position.set(r.camera.position.x, 0, r.camera.position.z);
r.seaMat.uniforms.camPos.value.copy(r.camera.position);
r.cloudMat.uniforms.camPos.value.copy(r.camera.position);
await loaded;
r.render();
window.__lookdev = {
  ready: true, calls: r.renderer.info.render.calls, triangles: r.renderer.info.render.triangles,
  clouds: r.clouds.count, textureWidth: r.cloudMat.uniforms.cloudMap.value.image.width,
  msaa: r.renderer.getContext().getContextAttributes().antialias,
  programs: r.renderer.info.programs.map(p => ({ runnable: p.diagnostics?.runnable !== false })),
};
</script></body></html>
